<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Etiquetas de Productos</title>
	<style>
		@page {
			size: 56mm 44mm;
			margin: 0;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 56mm;
			height: 44mm;
			font-family: Arial, sans-serif;
			color: #000;
			font-size: 8.5pt;
		}

		.label {
			width: 56mm;
			height: 44mm;
			border: 0.3mm solid #000;
			box-sizing: border-box;
			padding: 0.8mm;
			page-break-after: always;
			overflow: hidden;
		}

		.label:last-child {
			page-break-after: auto;
		}

		.main-code {
			font-size: 11pt;
			font-weight: 700;
			text-align: center;
			line-height: 1.1;
			margin-bottom: 0.7mm;
		}

		.description {
			font-size: 7.4pt;
			text-align: center;
			min-height: 6.5mm;
			max-height: 6.5mm;
			overflow: hidden;
			margin-bottom: 0.6mm;
		}

		.barcode {
			width: 100%;
			text-align: center;
			margin-top: 0;
		}

		.barcode img {
			display: block;
			width: 100%;
			height: 14mm;
			object-fit: fill;
		}

		.code-text {
			font-size: 9pt;
			font-weight: 700;
			text-align: center;
			letter-spacing: 0.4px;
			margin-top: 0.8mm;
		}
	</style>
</head>

<body>
	{% for label in labels %}
	<div class="label">
		<div class="main-code">{{ label.main_code or '-' }}</div>
		<div class="description">{{ label.description or 'SIN DESCRIPCION' }}</div>

		<div class="barcode">
			{% if label.barcode_base64 %}
			<img src="data:image/png;base64,{{ label.barcode_base64 }}" alt="Barcode {{ label.code }}">
			{% else %}
			<div>[SIN CODIGO DE BARRAS]</div>
			{% endif %}
		</div>

		<div class="code-text">{{ label.code }}</div>
	</div>
	{% endfor %}
</body>

</html>
