<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #111827;
            margin: 0;
            padding: 24px;
            font-size: 12px;
        }
        .header {
            margin-bottom: 18px;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 12px;
            color: #6b7280;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        thead {
            background: #f3f4f6;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.03em;
            color: #374151;
        }
        .footer {
            margin-top: 16px;
            font-size: 10px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">{{ title }}</div>
        <div class="subtitle">Generado el {{ now().strftime('%d/%m/%Y %H:%M') }}</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.code }}</td>
                <td>{{ user.description }}</td>
                <td>{{ user.email or '-' }}</td>
                <td>{{ user.status }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No hay usuarios para mostrar.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="footer">
        Total de usuarios: {{ users|length }}
    </div>
</body>
</html>
