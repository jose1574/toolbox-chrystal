{% extends "base.html" %}

{% block title %}Reporte de existencia de productos{% endblock %}

{% block content %}
<div class="p-4 ml-[4.5rem]">
    <div class="mx-auto max-w-5xl">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Reporte de existencia de productos</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Busca un producto por codigo o catalogo para ver su existencia en cada deposito.
            </p>
        </div>

        <div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Buscar producto</h2>
            
            <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-12 md:items-end">
                
                <div class="md:col-span-6">
                    <label for="product-code-input" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Código</label>
                    <input type="text" id="product-code-input" name="product_code" autocomplete="off"
                        placeholder="CÓDIGO DE PRODUCTO"
                        class="block h-10 w-full rounded-md border border-gray-300 px-3 text-sm uppercase shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100">
                </div>
                
                <button type="button" id="search-by-code"
                    class="inline-flex h-10 w-full items-center justify-center rounded-md bg-blue-600 px-4 text-sm font-medium text-white shadow-sm transition duration-200 ease-in-out hover:bg-blue-700 hover:-translate-y-0.5 active:translate-y-0 transform focus:outline-none focus:ring-2 focus:ring-blue-500 md:col-span-3">
                    Buscar
                </button>
                
                <button type="button" id="open-catalog-modal"
                    class="inline-flex h-10 w-full items-center justify-center rounded-md border border-emerald-600 bg-transparent px-4 text-sm font-medium text-emerald-600 shadow-sm transition duration-200 ease-in-out hover:bg-emerald-600 hover:text-white hover:-translate-y-0.5 active:translate-y-0 transform focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-emerald-400 dark:border-emerald-500 dark:hover:bg-emerald-600 dark:hover:text-white md:col-span-3 whitespace-nowrap">
                    Buscar en catálogo
                </button>
                
            </div>
        </div>

        <div id="product-stock-details" class="mt-4"></div>
    </div>
</div>

<div id="modal-products-stock"></div>

<script>
    (function () {
        const codeInput = document.getElementById('product-code-input');
        const searchByCodeButton = document.getElementById('search-by-code');
        const openCatalogButton = document.getElementById('open-catalog-modal');
        const detailsContainer = document.getElementById('product-stock-details');
        const detailsUrl = '{{ url_for("reports.product_stock_details") }}';
        const modalUrl = '{{ url_for("reports.modal_producs_stock") }}';

        async function loadProductStock(productCode) {
            const code = (productCode || '').trim();
            if (!code) return;

            try {
                const params = new URLSearchParams({ product_code: code });
                const response = await fetch(`${detailsUrl}?${params.toString()}`, {
                    credentials: 'same-origin',
                    headers: { 'HX-Request': 'true' },
                });
                detailsContainer.innerHTML = await response.text();
                codeInput.value = code.toUpperCase();
            } catch (err) {
                detailsContainer.innerHTML = '<div class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">No se pudo cargar la existencia del producto.</div>';
            }
        }

        async function openCatalogModal(query, page) {
            try {
                const params = new URLSearchParams({
                    q: query || '',
                    page: page || 1,
                });
                const response = await fetch(`${modalUrl}?${params.toString()}`, {
                    credentials: 'same-origin',
                    headers: { 'HX-Request': 'true' },
                });
                document.getElementById('modal-products-stock').innerHTML = await response.text();
            } catch (err) {
                detailsContainer.innerHTML = '<div class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">No se pudo abrir el catalogo de productos.</div>';
            }
        }

        function closeCatalogModal() {
            document.getElementById('modal-products-stock').innerHTML = '';
        }

        searchByCodeButton.addEventListener('click', function () {
            loadProductStock(codeInput.value);
        });

        codeInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                loadProductStock(codeInput.value);
            }
        });

        openCatalogButton.addEventListener('click', function () {
            openCatalogModal('', 1);
        });

        document.addEventListener('click', function (event) {
            const closeModal = event.target.closest('[data-close-product-stock-modal]');
            if (closeModal || event.target.id === 'product-stock-modal') {
                closeCatalogModal();
                return;
            }

            const selectProduct = event.target.closest('[data-select-product-stock]');
            if (selectProduct) {
                loadProductStock(selectProduct.dataset.code || '');
                closeCatalogModal();
                return;
            }

            const pageButton = event.target.closest('[data-product-stock-page]');
            if (pageButton) {
                openCatalogModal(
                    pageButton.dataset.query || '',
                    Number(pageButton.dataset.productStockPage || 1)
                );
            }
        });

        document.addEventListener('submit', function (event) {
            const searchForm = event.target.closest('#product-stock-search-form');
            if (!searchForm) return;
            event.preventDefault();
            const formData = new FormData(searchForm);
            openCatalogModal(formData.get('q') || '', 1);
        });
    })();
</script>
{% endblock %}
