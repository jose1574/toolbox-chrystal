<div class="modal fade" id="providerNewProductModal" tabindex="-1" aria-labelledby="providerNewProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content provider-modal-shell border-0 shadow-lg">
            <div class="modal-header border-0 pb-0 px-4 pt-4">
                <div>
                    <div class="provider-modal-eyebrow text-uppercase small fw-semibold mb-1">Nueva oferta</div>
                    <h5 class="modal-title fw-bold mb-0" id="providerNewProductModalLabel">Proponer producto nuevo</h5>
                    <p class="text-muted small mb-0">Registra una propuesta para que el equipo de compras la revise junto con el resto de la oferta.</p>
                </div>
                <button type="button" class="btn-close" aria-label="Close" onclick="closeProviderNewProductModal()"></button>
            </div>

            <div class="modal-body px-4 pb-4 pt-3">
                {% if error_message %}
                <div class="alert alert-danger" role="alert">
                    {{ error_message }}
                </div>
                {% endif %}

                <form
                    hx-post="{{ url_for('shopping.provider_offer_items_add_new_product') }}"
                    hx-target="#provider-offer-details-container"
                    hx-swap="outerHTML"
                    hx-on::after-request="if(event.detail.successful){ closeProviderNewProductModal(); }"
                >
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="proposed_main_code" class="form-label fw-semibold">Main product code</label>
                            <input
                                type="text"
                                class="form-control"
                                id="proposed_main_code"
                                name="proposed_main_code"
                                value="{{ form_data.get('proposed_main_code', '') }}"
                                placeholder="Principal code used by the provider"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label for="proposed_description" class="form-label fw-semibold">Description</label>
                            <input
                                type="text"
                                class="form-control"
                                id="proposed_description"
                                name="proposed_description"
                                value="{{ form_data.get('proposed_description', '') }}"
                                placeholder="Product name or commercial description"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="proposed_reference" class="form-label fw-semibold">Reference</label>
                            <input
                                type="text"
                                class="form-control"
                                id="proposed_reference"
                                name="proposed_reference"
                                value="{{ form_data.get('proposed_reference', '') }}"
                                placeholder="Reference, model or presentation"
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="proposed_unit_code" class="form-label fw-semibold">Unit</label>
                            <select class="form-select" id="proposed_unit_code" name="proposed_unit_code">
                                <option value="">Select a unit</option>
                                {% for unit in units %}
                                <option value="{{ unit.code }}" {% if form_data.get('proposed_unit_code') == unit.code %}selected{% endif %}>
                                    {{ unit.description }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="proposed_mark_code" class="form-label fw-semibold">Brand</label>
                            <select class="form-select" id="proposed_mark_code" name="proposed_mark_code">
                                <option value="">Select a brand</option>
                                {% for mark in marks %}
                                <option value="{{ mark.code }}" {% if form_data.get('proposed_mark_code') == mark.code %}selected{% endif %}>
                                    {{ mark.description }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="proposed_department_code" class="form-label fw-semibold">Department</label>
                            <select class="form-select" id="proposed_department_code" name="proposed_department_code">
                                <option value="">Select a department</option>
                                {% for department in departments %}
                                <option value="{{ department.code }}" {% if form_data.get('proposed_department_code') == department.code %}selected{% endif %}>
                                    {{ department.description }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="requested_amount" class="form-label fw-semibold">Quantity</label>
                            <input
                                type="number"
                                class="form-control"
                                id="requested_amount"
                                name="requested_amount"
                                value="{{ form_data.get('requested_amount', '') }}"
                                min="0"
                                step="any"
                                placeholder="0"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="unitary_cost" class="form-label fw-semibold">Unit price</label>
                            <input
                                type="number"
                                class="form-control"
                                id="unitary_cost"
                                name="unitary_cost"
                                value="{{ form_data.get('unitary_cost', '') }}"
                                min="0"
                                step="any"
                                placeholder="0"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label for="provider_note" class="form-label fw-semibold">Provider note</label>
                            <textarea
                                class="form-control"
                                id="provider_note"
                                name="provider_note"
                                rows="3"
                                placeholder="Optional commercial details, lead time, minimum order, packaging or observations"
                            >{{ form_data.get('provider_note', '') }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary" onclick="closeProviderNewProductModal()">Cancel</button>
                        <button type="submit" class="provider-success-btn btn px-4">Add to offer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
