<div class="modal fade" id="providerOfferDraftsModal" tabindex="-1" aria-labelledby="providerOfferDraftsModalLabel" aria-hidden="true">
    <style>
        #providerOfferDraftsModal .modal-dialog {
            width: min(52rem, calc(100vw - 1rem));
            max-width: calc(100vw - 1rem);
            margin: 0.75rem auto;
        }

        #providerOfferDraftsModal .modal-content {
            max-height: min(86vh, 46rem);
            background: #161821;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
        }

        #providerOfferDraftsModal .provider-drafts-header {
            padding: 1rem 1.15rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: #161821;
        }

        #providerOfferDraftsModal .provider-drafts-kicker {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: 700;
        }

        #providerOfferDraftsModal .provider-drafts-body {
            min-height: 0;
            overflow-y: auto;
            background: #11131a;
        }

        #providerOfferDraftsModal .provider-drafts-close {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #e5e7eb;
        }

        #providerOfferDraftsModal .provider-drafts-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f9fafb;
        }
    </style>

    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0">
            <div class="provider-drafts-header d-flex align-items-start justify-content-between gap-3">
                <div>
                    <div class="provider-drafts-kicker">Trabajo guardado</div>
                    <h5 class="modal-title fw-bold mb-1" id="providerOfferDraftsModalLabel">Listas en espera</h5>
                    <p class="text-body-secondary small mb-0">Tu trabajo se guarda automaticamente. Carga una lista para continuar donde la dejaste.</p>
                </div>
                <button type="button" class="provider-drafts-close d-inline-flex align-items-center justify-content-center" aria-label="Close" onclick="closeProviderOfferDraftsModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <div class="provider-drafts-body p-3" id="provider-offer-drafts-modal-content">
                {% include 'providers/partials/offer_drafts_content.html' %}
            </div>
        </div>
    </div>
</div>
