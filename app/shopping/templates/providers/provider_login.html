<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Proveedores | Toolbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --provider-bg: #0b1220;
            --provider-bg-2: #111827;
            --provider-card: rgba(22, 24, 33, 0.96);
            --provider-border: rgba(255, 255, 255, 0.08);
            --provider-field: rgba(255, 255, 255, 0.03);
            --provider-field-border: rgba(255, 255, 255, 0.06);
            --provider-label: #9ca3af;
            --provider-placeholder: #6b7280;
            --provider-text: #f9fafb;
            --provider-primary: #2563eb;
            --provider-primary-shadow: rgba(37, 99, 235, 0.35);
            --provider-link: #60a5fa;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, var(--provider-bg) 0%, var(--provider-bg-2) 100%);
            color: var(--provider-text);
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        .provider-login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .provider-login-card {
            width: 100%;
            max-width: 440px;
            background: var(--provider-card);
            border: 1px solid var(--provider-border);
            border-radius: 24px;
            box-shadow: 0 24px 24px rgba(0, 0, 0, 0.38);
            padding: 3rem 3rem 2rem;
        }

        .provider-login-brand {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--provider-text);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .provider-login-title {
            margin: 0;
            color: var(--provider-text);
            font-size: clamp(2rem, 2vw + 0.8rem, 2.2rem);
            font-weight: 700;
            text-align: center;
        }

        .provider-login-subtitle {
            margin: 0.5rem 0 1.5rem;
            color: var(--provider-placeholder);
            font-size: 0.94rem;
            text-align: center;
        }

        .provider-login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .provider-login-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .provider-login-label {
            margin: 0;
            color: var(--provider-label);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .provider-login-input-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--provider-field);
            border: 1px solid var(--provider-field-border);
            border-radius: 12px;
            min-height: 52px;
            padding: 0 0.9rem;
        }

        .provider-login-icon {
            width: 18px;
            height: 18px;
            color: #d1d5db;
            flex-shrink: 0;
        }

        .provider-login-input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: var(--provider-text);
            font-size: 0.96rem;
            padding: 0.7rem 0;
            box-shadow: none;
        }

        .provider-login-input::placeholder {
            color: var(--provider-placeholder);
        }

        .provider-login-input:focus {
            box-shadow: none;
            outline: none;
        }

        .provider-login-btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: var(--provider-primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.9rem 1rem;
            box-shadow: 0 10px 12px var(--provider-primary-shadow);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .provider-login-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

.provider-login-mode-switch {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--provider-field-border);
            border-radius: 12px;
            padding: 0.35rem;
            margin-bottom: 1rem;
        }

        .provider-login-mode {
            border: 0;
            background: transparent;
            color: var(--provider-placeholder);
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            padding: 0.6rem 0.75rem;
            transition: all 0.2s ease;
        }

        .provider-login-mode.is-active {
            background: rgba(37, 99, 235, 0.18);
            color: #dfeeff;
            box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.3);
        }

        .provider-login-alert {
            margin-bottom: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .provider-login-footer {
            margin-top: 0.5rem;
            text-align: center;
            color: var(--provider-placeholder);
            font-size: 0.875rem;
        }

        .provider-login-footer a {
            color: var(--provider-link);
            font-weight: 600;
            text-decoration: underline;
        }

        @media (max-width: 575.98px) {
            .provider-login-card {
                padding: 2rem 1.25rem 1.5rem;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="provider-login-screen">
        <div class="provider-login-card">
            <div class="provider-login-brand">Portal de Proveedores</div>

            <h1 class="provider-login-title">Iniciar sesión</h1>
            <p class="provider-login-subtitle">Ingresa tus credenciales para acceder</p>

            <form method="post" action="{{ url_for('shopping.provider_login') }}" class="provider-login-form">
                <div class="provider-login-mode-switch" role="tablist" aria-label="Forma de acceso">
                    <button type="button" class="provider-login-mode {% if (login_type or 'usuario') == 'usuario' %}is-active{% endif %}" data-mode="usuario">Usuario</button>
                    <button type="button" class="provider-login-mode {% if (login_type or 'usuario') == 'correo' %}is-active{% endif %}" data-mode="correo">Correo</button>
                </div>
                <input type="hidden" name="login_type" id="login_type" value="{{ login_type or 'usuario' }}">

                {% if error_message %}
                    <div class="provider-login-alert alert alert-danger mb-0" role="alert">{{ error_message }}</div>
                {% endif %}

                <div class="provider-login-field">
                    <label class="provider-login-label" for="login_value" id="login_label">{{ 'Correo electrónico' if (login_type or 'usuario') == 'correo' else 'Usuario' }}</label>
                    <div class="provider-login-input-wrap">
                        <svg class="provider-login-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input id="login_value" name="login_value" class="provider-login-input" type="text" value="{{ login_value or '' }}" placeholder="{{ 'ejemplo@correo.com' if (login_type or 'usuario') == 'correo' else 'PROVEEDOR_ACME' }}" autocomplete="username">
                    </div>
                </div>

                <div class="provider-login-field">
                    <label class="provider-login-label" for="password">Clave</label>
                    <div class="provider-login-input-wrap">
                        <svg class="provider-login-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 10V8a5 5 0 1 1 10 0v2M6 10h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input id="password" name="password" class="provider-login-input" type="password" value="{{ password or '' }}" placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn provider-login-btn">Iniciar sesión</button>

                <div class="provider-login-footer">
                    <span>¿No tienes cuenta? </span><a href="{{ url_for('shopping.provider_register') }}">Regístrate</a>
                </div>

                <div class="mt-3 text-center">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link text-decoration-none p-0 d-inline-flex align-items-center gap-2 text-white-50 fw-semibold">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Volver a selección de tipo de usuario
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const modeButtons = document.querySelectorAll('.provider-login-mode');
            const loginTypeInput = document.getElementById('login_type');
            const loginLabel = document.getElementById('login_label');
            const loginInput = document.getElementById('login_value');

            function applyMode(mode) {
                const isEmail = mode === 'correo';
                loginTypeInput.value = mode;
                loginLabel.textContent = isEmail ? 'Correo electrónico' : 'Usuario';
                loginInput.placeholder = isEmail ? 'ejemplo@correo.com' : 'PROVEEDOR_ACME';
                loginInput.autocomplete = isEmail ? 'email' : 'username';
                modeButtons.forEach(function (button) {
                    button.classList.toggle('is-active', button.dataset.mode === mode);
                });
            }

            modeButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    applyMode(button.dataset.mode);
                });
            });

            const currentMode = loginTypeInput.value || 'usuario';
            applyMode(currentMode);
        });
    </script>
</body>
</html>
