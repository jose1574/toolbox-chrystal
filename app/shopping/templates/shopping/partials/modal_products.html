<div class="modal fade" id="productsModal" tabindex="-1" aria-labelledby="productsModalLabel" aria-hidden="true">
	<style>
		#productsModal .modal-dialog {
			width: max-content;
			max-width: calc(100vw - 2rem);
		}

		#productsModal .modal-content {
			min-width: min(72rem, calc(100vw - 2rem));
		}
	</style>

	<div class="modal-dialog modal-fullscreen-sm-down modal-dialog-scrollable">
		<div class="modal-content">
			<div class="modal-header">
				<div>
					<h2 class="modal-title h5" id="productsModalLabel">Seleccionar producto</h2>
					<p class="small text-body-secondary mb-0">Filtra por codigo, nombre o referencia. Puedes usar * como comodin.</p>
				</div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
			</div>
			<div class="modal-body">
				<div class="row g-2 align-items-end mb-3">
					<div class="col-12 col-lg-4">
						<label for="product-modal-search" class="form-label small fw-semibold text-body-secondary">Buscar producto</label>
						<input type="search" class="form-control form-control-sm" id="product-modal-search" name="q"
							value="{{ query }}" placeholder="Codigo o nombre" autocomplete="off"
							hx-get="{{ url_for('shopping.products_list') }}" hx-trigger="keyup changed delay:300ms"
							hx-include="#product-modal-search, #product-reference-filter, #product-modal-filters"
							hx-target="#products-list-content" hx-swap="outerHTML">
					</div>
					<div class="col-12 col-lg-3">
						<label for="product-reference-filter" class="form-label small fw-semibold text-body-secondary">Referencia</label>
						<input type="search" class="form-control form-control-sm" id="product-reference-filter" name="reference"
							value="{{ reference }}" placeholder="Referencia" autocomplete="off"
							hx-get="{{ url_for('shopping.products_list') }}" hx-trigger="keyup changed delay:300ms"
							hx-include="#product-modal-search, #product-reference-filter, #product-modal-filters"
							hx-target="#products-list-content" hx-swap="outerHTML">
					</div>
					<div class="col-12 col-lg-5" id="product-modal-filters">
						<div class="d-flex flex-column flex-md-row gap-2">
							<div class="dropdown flex-fill">
								<label class="form-label small fw-semibold text-body-secondary mb-1">Marca</label>
								<button class="btn btn-outline-secondary btn-sm dropdown-toggle w-100 text-start" type="button"
									data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
									<span data-filter-label="mark">{{ mark_codes|length if mark_codes else 'Todas' }}{% if mark_codes %} seleccionadas{% endif %}</span>
								</button>
								<div class="dropdown-menu w-100 p-2 overflow-auto" style="max-height: 16rem;">
									{% for mark in marks %}
									<label class="dropdown-item d-flex align-items-start gap-2 small text-wrap">
										<input class="form-check-input mt-0 product-filter-checkbox" type="checkbox" name="mark_codes"
											value="{{ mark.code }}" {% if mark.code in mark_codes %}checked{% endif %}
											hx-get="{{ url_for('shopping.products_list') }}" hx-trigger="change"
											hx-include="#product-modal-search, #product-reference-filter, #product-modal-filters"
											hx-target="#products-list-content" hx-swap="outerHTML">
										<span>{{ mark.description or mark.code }}</span>
									</label>
									{% endfor %}
								</div>
							</div>
							<div class="dropdown flex-fill">
								<label class="form-label small fw-semibold text-body-secondary mb-1">Departamento</label>
								<button class="btn btn-outline-secondary btn-sm dropdown-toggle w-100 text-start" type="button"
									data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
									<span data-filter-label="department">{{ department_codes|length if department_codes else 'Todos' }}{% if department_codes %} seleccionados{% endif %}</span>
								</button>
								<div class="dropdown-menu w-100 p-2 overflow-auto" style="max-height: 16rem;">
									{% for department in departments %}
									<label class="dropdown-item d-flex align-items-start gap-2 small text-wrap">
										<input class="form-check-input mt-0 product-filter-checkbox" type="checkbox" name="department_codes"
											value="{{ department.code }}" {% if department.code in department_codes %}checked{% endif %}
											hx-get="{{ url_for('shopping.products_list') }}" hx-trigger="change"
											hx-include="#product-modal-search, #product-reference-filter, #product-modal-filters"
											hx-target="#products-list-content" hx-swap="outerHTML">
										<span>{{ department.description or department.code }}</span>
									</label>
									{% endfor %}
								</div>
							</div>
						</div>
					</div>
				</div>

				{% include 'shopping/partials/products_list.html' %}
			</div>
			<div class="modal-footer justify-content-between">
				<span class="small text-body-secondary">Usa flechas arriba/abajo y Enter para seleccionar.</span>
				<button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
			</div>
		</div>
	</div>
</div>

<script>
	(() => {
		const modalElement = document.getElementById('productsModal');
		if (!modalElement || modalElement.dataset.ready === 'true') {
			return;
		}

		modalElement.dataset.ready = 'true';
		const productsModal = bootstrap.Modal.getOrCreateInstance(modalElement);
		const searchInput = modalElement.querySelector('#product-modal-search');

		const getOptions = () => Array.from(modalElement.querySelectorAll('[data-product-select-link]'));

		modalElement.addEventListener('change', (event) => {
			if (!event.target.matches('.product-filter-checkbox')) {
				return;
			}

			const markCount = modalElement.querySelectorAll('input[name="mark_codes"]:checked').length;
			const departmentCount = modalElement.querySelectorAll('input[name="department_codes"]:checked').length;
			const markLabel = modalElement.querySelector('[data-filter-label="mark"]');
			const departmentLabel = modalElement.querySelector('[data-filter-label="department"]');

			if (markLabel) {
				markLabel.textContent = markCount ? `${markCount} seleccionadas` : 'Todas';
			}

			if (departmentLabel) {
				departmentLabel.textContent = departmentCount ? `${departmentCount} seleccionados` : 'Todos';
			}
		});

		modalElement.addEventListener('keydown', (event) => {
			if (!['ArrowDown', 'ArrowUp', 'Enter'].includes(event.key)) {
				return;
			}

			const options = getOptions();
			if (!options.length) {
				return;
			}

			const activeOption = document.activeElement.closest('[data-product-select-link]');
			const activeIndex = options.indexOf(activeOption);

			if (event.key === 'Enter') {
				if (activeOption) {
					return;
				}
				return;
			}

			event.preventDefault();
			const nextIndex = event.key === 'ArrowDown'
				? Math.min(activeIndex + 1, options.length - 1)
				: Math.max(activeIndex - 1, 0);
			options[nextIndex >= 0 ? nextIndex : 0].focus();
		});

		modalElement.addEventListener('htmx:afterRequest', (event) => {
			if (event.target.closest('[data-product-select-link]')) {
				productsModal.hide();
			}
		});

		modalElement.addEventListener('shown.bs.modal', () => {
			searchInput?.focus();
		});

		modalElement.addEventListener('hidden.bs.modal', () => {
			modalElement.remove();
		});

		productsModal.show();
	})();
</script>
