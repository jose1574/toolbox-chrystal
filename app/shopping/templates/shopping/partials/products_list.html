<div id="products-list-content">
    <style>
        #products-list-content .product-select-table tbody tr[data-product-option] {
            cursor: pointer;
        }

        #products-list-content .product-select-table tbody tr[data-product-option]:hover,
        #products-list-content .product-select-table tbody tr[data-product-option]:focus-within {
            --bs-table-bg: var(--bs-primary-bg-subtle);
            --bs-table-color: var(--bs-body-color);
            outline: 2px solid var(--bs-primary-border-subtle);
            outline-offset: -2px;
        }

        #products-list-content .products-list-scroll {
            max-height: min(28rem, 58vh);
            overflow: auto;
        }

        #products-list-content .product-select-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--bs-table-bg);
            box-shadow: inset 0 -1px 0 var(--bs-border-color);
        }
    </style>

    <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mb-3 small text-body-secondary">
        <span>{{ total_products }} productos encontrados</span>
        <span>Pagina {{ current_page }} de {{ total_pages }}</span>
    </div>

    <div class="table-responsive rounded border border-secondary-subtle products-list-scroll" id="products-scroll-container">
        <table class="table table-sm table-hover product-select-table align-middle mb-0">
            <thead class="table-light small text-uppercase">
                <tr>
                    <th scope="col">Codigo / nombre</th>
                    <th scope="col">Unidad</th>
                    <th scope="col">Marca</th>
                    <th scope="col">Departamento</th>
                    <th scope="col">Referencia</th>
                    {% for store in stock_stores %}
                    <th scope="col" class="text-end">{{ store.description }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% include 'shopping/partials/products_list_rows.html' %}
            </tbody>
        </table>
    </div>
</div>
