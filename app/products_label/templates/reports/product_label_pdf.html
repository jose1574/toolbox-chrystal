<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Etiquetas de Productos</title>
	<style>
		@page {
			size: {{ page_width }} {{ page_height }};
			margin: 0;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: {{ page_width }};
			height: {{ page_height }};
			font-family: Arial, sans-serif;
			font-size: 8.5pt;
		}

		.label {
			width: {{ page_width }};
			height: {{ page_height }};
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			page-break-after: always;
			overflow: hidden;
		}

		.label:last-child {
			page-break-after: auto;
		}

		.logo {
			width: 100%;
			text-align: center;
			margin: 0 0 0.4mm;
		}

		.logo img {
			display: inline-block;
			max-width: 20mm;
			max-height: 20mm;
			object-fit: contain;
		}

		

		

		.barcode {
			width: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
			margin: 0;
		}

		.barcode img {
			display: block;
			width: 100%;
			height: 8mm;
			object-fit: fill;
		}

		.code-text {
			font-size: 10pt;
			font-weight: 700;
			text-align: center;
			letter-spacing: -0.1mm;
			margin: 0.6mm 0 0;
			white-space: normal;
			word-break: break-all;
			overflow-wrap: anywhere;
			max-width: 100%;
			width: 100%;
		}

		.description-text {
			font-size: 7pt;
			text-align: center;
			line-height: 1.2;
			margin: 0.5mm 0 0.4mm;
			white-space: normal;
			word-break: break-word;
			overflow-wrap: anywhere;
			max-width: 100%;
			width: 100%;
		}

		.format-57x40 .code-text {
			font-size: 18pt;
			line-height: 1.05;
		}
	</style>
</head>

<body class="format-{{ label_format }}">
	{% for label in labels %}
	<div class="label">
		{% if logo_base64 %}
		<div class="logo">
			<img src="data:image/png;base64,{{ logo_base64 }}" alt="Logo">
		</div>
		{% endif %}
		<div class="barcode">
			{% if label.barcode_base64 %}
			<img src="data:image/png;base64,{{ label.barcode_base64 }}" alt="Code128 barcode {{ label.code }}">
			{% else %}
			<div>[SIN CODIGO DE BARRAS]</div>
			{% endif %}
		</div>
		<p class="description-text">{{ label.description }}</p>
		<p class="code-text"> <b>{{ label.code }}</b> </p>

	</div>
	{% endfor %}
</body>

</html>
