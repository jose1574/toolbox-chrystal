<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Etiquetas de Productos</title>
    <style>
        @page {
            size: 56mm 44mm;
            margin: 1mm;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #000;
            font-size: 8.5pt;
        }

        .label {
            width: 54mm;
            height: 42mm;
            border: 0.3mm solid #000;
            box-sizing: border-box;
            padding: 1.2mm;
            page-break-after: always;
            overflow: hidden;
        }

        .label:last-child {
            page-break-after: auto;
        }

        .main-code {
            font-size: 10pt;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 1mm;
        }

        .description {
            font-size: 7.2pt;
            text-align: center;
            min-height: 7mm;
            max-height: 7mm;
            overflow: hidden;
            margin-bottom: 1mm;
        }

        .barcode {
            text-align: center;
            margin-top: 0.5mm;
        }

        .barcode img {
            width: 48mm;
            height: 12mm;
            object-fit: contain;
        }

        .code-text {
            font-size: 8pt;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            margin-top: 1mm;
        }

        .logo {
            text-align: center;
            margin-top: 1mm;
        }

        .logo img {
            width: 20mm;
            height: auto;
            display: inline-block;
        }
    </style>
</head>

<body>
    {% for label in labels %}
    <div class="label">
        <div class="main-code">{{ label.main_code or '-' }}</div>
        <div class="description">{{ label.description or 'SIN DESCRIPCION' }}</div>

        <div class="barcode">
            {% if label.barcode_base64 %}
            <img src="data:image/png;base64,{{ label.barcode_base64 }}" alt="Barcode {{ label.code }}">
            {% else %}
            <div>[SIN CODIGO DE BARRAS]</div>
            {% endif %}
        </div>
        {% if logo_base64 %}
        <div class="logo">
            <img src="data:image/png;base64,{{ logo_base64 }}" alt="Logo">
        </div>
        {% endif %}

    </div>
    {% endfor %}
</body>

</html>
