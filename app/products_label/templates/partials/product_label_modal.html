<div class="modal fade show d-block" tabindex="-1" aria-hidden="true" role="dialog" aria-modal="true" style="background-color: rgba(0, 0, 0, 0.5);">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow">
      <div class="modal-header">
        <h3 class="modal-title h5 mb-0">Etiqueta de producto</h3>
        <button type="button" class="btn-close" aria-label="Cerrar" onclick="closeModal()"></button>
      </div>
      <div class="modal-body">

      {% if error_message %}
      <div class="alert alert-danger mb-3" role="alert">
        {{ error_message }}
      </div>
      {% endif %}

      {% if product %}
      <div class="mb-3">
        <p class="mb-1"><span class="fw-semibold">Código principal:</span> {{ product.code }}</p>
        <p class="mb-0"><span class="fw-semibold">Descripción:</span> {{ product.description }}</p>
      </div>
      <hr />
      <h4 class="h6 fw-semibold mb-3">Códigos alternos para este producto</h4>
      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Códigos del producto</th>
            </tr>
          </thead>
          <tbody>
            {% for code in product_codes %}
            <tr>
              <td>
                <form
                  hx-get="{{ url_for('products_label.update_short_name_modal') }}"
                  hx-target="#modal-update-short-name-product"
                  hx-swap="innerHTML"
                  class="d-inline"
                  hx-on:htmx:after-request="document.getElementById('modal-product-label').innerHTML = '';"
                >
                  <input type="hidden" name="product_code" value="{{ product.code }}" />
                  <input type="hidden" name="label_code" value="{{ code.other_code }}" />
                  <button type="submit" class="btn btn-link p-0 text-decoration-none text-body">
                    {{ code.other_code }}
                  </button>
                </form>
              </td>
            </tr>
            {% else %}
            <tr>
              <td>
                <form
                  hx-get="{{ url_for('products_label.update_short_name_modal') }}"
                  hx-target="#modal-update-short-name-product"
                  hx-swap="innerHTML"
                  class="d-inline"
                  hx-on:htmx:after-request="document.getElementById('modal-product-label').innerHTML = '';"
                >
                  <input type="hidden" name="product_code" value="{{ product.code }}" />
                  <input type="hidden" name="label_code" value="{{ product.code }}" />
                  <button type="submit" class="btn btn-link p-0 text-decoration-none text-body">
                    {{ product.code }}
                  </button>
                </form>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      {% endif %}
      </div>
    </div>
  </div>
</div>
