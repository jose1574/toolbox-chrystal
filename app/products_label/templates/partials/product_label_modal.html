<div class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
  <div class="p-4 border max-w-md w-full shadow-lg rounded-md bg-white" style="max-height: 85vh; overflow-y: auto;">
    <div class="flex items-start justify-between mb-3">
      <h3 class="text-lg font-medium text-gray-900">Etiqueta de producto</h3>
      <button
        type="button"
        onclick="openUpdateShortNameModalFromProductLabel()"
        class="text-gray-500 hover:text-gray-700 focus:outline-none"
      >
        Cerrar
      </button>
    </div>

    {% if error_message %}
    <div class="mb-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800">
      {{ error_message }}
    </div>
    {% endif %}
    {% if product %}
    <div class="mt-2 px-1 space-y-2 text-sm text-gray-700">
      <p><span class="font-medium">Codigo principal:</span> {{ product.code }}</p>
      <p><span class="font-medium">Descripcion:</span> {{ product.description }}</p>
    </div>
    <hr class="my-3" />
    <h4 class="text-sm font-medium text-gray-900 mb-2">Codigos alternos para este producto</h4>
    <table class="w-full text-sm text-left text-gray-700" style="border-collapse: collapse;">
      <thead>
        <tr>
          <th class="border border-gray-200 px-3 py-2 bg-gray-50">Codigos del producto</th>
        </tr>
      </thead>
      <tbody>
        {% for code in product_codes %}
        <tr>
          <td class="border border-gray-200 px-3 py-2 cursor-pointer hover:bg-gray-50">
            <form
              hx-get="{{ url_for('products_label.update_short_name_modal') }}"
              hx-target="#modal-update-short-name-product"
              hx-swap="innerHTML"
              style="display:inline"
              hx-on:htmx:after-request="document.getElementById('modal-product-label').innerHTML = '';"
            >
              <input type="hidden" name="product_code" value="{{ product.code }}" />
              <input type="hidden" name="label_code" value="{{ code.other_code }}" />
              <button type="submit" class="text-gray-900 w-full text-left bg-transparent border-0 p-0 m-0 cursor-pointer">{{ code.other_code }}</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr>
          <td class="border border-gray-200 px-3 py-2 cursor-pointer hover:bg-gray-50">
            <form
              hx-get="{{ url_for('products_label.update_short_name_modal') }}"
              hx-target="#modal-update-short-name-product"
              hx-swap="innerHTML"
              style="display:inline"
              hx-on:htmx:after-request="document.getElementById('modal-product-label').innerHTML = '';"
            >
              <input type="hidden" name="product_code" value="{{ product.code }}" />
              <input type="hidden" name="label_code" value="{{ product.code }}" />
              <button type="submit" class="text-gray-900 w-full text-left bg-transparent border-0 p-0 m-0 cursor-pointer">{{ product.code }}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </div>
</div>
