<div class="modal fade show d-block" tabindex="-1" aria-hidden="true" role="dialog" aria-modal="true" style="background-color: rgba(0, 0, 0, 0.5);">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow">
      <div class="modal-header">
        <h3 class="modal-title h5 mb-0">Editar nombre corto del producto</h3>
        <button type="button" class="btn-close" aria-label="Cerrar" onclick="closeUpdateShortNameModal()"></button>
      </div>
      <div class="modal-body">

      {% if error_message %}
      <div class="alert alert-danger mb-3" role="alert">
        {{ error_message }}
      </div>
      {% endif %}
      {% if product %}
      <div class="mb-3">
        <p class="mb-1"><span class="fw-semibold">Código principal:</span> {{ product.code }}</p>
        <p class="mb-0"><span class="fw-semibold">Descripción:</span> {{ product.description }}</p>
      </div>
      <hr />

      <form
        hx-post="{{ url_for('products_label.update_short_name_product') }}"
        hx-target="#products-label-list"
        hx-swap="beforeend"
        hx-on:htmx:after-request="if(event.detail.successful){closeUpdateShortNameModal(true);}"
        class="vstack gap-3"
      >
        <input type="hidden" name="product_code" value="{{ product.code }}" />
        <input type="hidden" name="code_to_add" value="{{ label_code or product.code }}" />

        <div>
          <label for="short_name" class="form-label fw-semibold">
            Nombre corto
          </label>
          <input
            type="text"
            id="short_name"
            name="short_name"
            value="{{ product.short_name or '' }}"
            class="form-control"
            maxlength="120"
            autocomplete="off"
          />
        </div>

        <p class="text-body-secondary small mb-0">
          Código para etiqueta: <span class="fw-semibold">{{ label_code or product.code }}</span>
        </p>

        <div class="d-flex justify-content-end gap-2 pt-2">
          <button
            type="button"
            onclick="closeUpdateShortNameModal()"
            class="btn btn-outline-secondary"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="btn btn-primary"
          >
            Guardar
          </button>
        </div>
      </form>
      {% endif %}
      </div>
    </div>
  </div>
</div>

<script>
  function closeUpdateShortNameModal(clearProductCodeInput) {
    const modalContainer = document.getElementById("modal-update-short-name-product");
    if (modalContainer) {
      modalContainer.innerHTML = "";
    }

    const input = document.getElementById("product_code");
    if (input) {
      if (clearProductCodeInput) {
        input.value = "";
      }
      input.focus();
      if (input.select) {
        input.select();
      }
    }
  }

  setTimeout(function () {
    const shortNameInput = document.getElementById("short_name");
    if (shortNameInput) {
      shortNameInput.focus();
      if (shortNameInput.select) {
        shortNameInput.select();
      }
    }
  }, 100);
</script>
