<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Etiquetas de Productos</title>
	<style>
		@page {
			size: 57mm 44mm;
			margin: 0;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 57mm;
			height: 44mm;
			font-family: Arial, sans-serif;
			color: #000;
			font-size: 8.5pt;
		}

		.label {
			width: 57mm;
			height: 44mm;
			border: 0.3mm solid #000;
			box-sizing: border-box;
			padding: 0.6mm 0.8mm;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: stretch;
			page-break-after: always;
			overflow: hidden;
		}

		.label:last-child {
			page-break-after: auto;
		}

		

		

		.barcode {
			width: 100%;
			text-align: center;
			margin: 0;
		}

		.barcode img {
			display: block;
			width: 100%;
			height: 14mm;
			object-fit: fill;
		}

		.code-text {
			font-size: 10.5mm;
			font-weight: 700;
			text-align: center;
			letter-spacing: -0.2mm;
			margin: 0.6mm 0 0;
			line-height: 1;
			white-space: nowrap;
			overflow: hidden;
			transform: scaleX(0.96);
			transform-origin: center;
		}
	</style>
</head>

<body>
	{% for label in labels %}
	<div class="label">
		<div class="barcode">
			{% if label.barcode_base64 %}
			<img src="data:image/png;base64,{{ label.barcode_base64 }}" alt="Barcode {{ label.code }}">
			{% else %}
			<div>[SIN CODIGO DE BARRAS]</div>
			{% endif %}
		</div>

		<div class="code-text">{{ label.code }}</div>
	</div>
	{% endfor %}
</body>

</html>
