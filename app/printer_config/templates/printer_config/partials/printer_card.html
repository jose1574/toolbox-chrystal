<div class="card shadow-sm border-0 bg-body h-100" id="printer-card-{{ card.report_key }}">
    <div class="card-body p-3 p-lg-4">
        <h2 class="h6 fw-bold mb-3">{{ card.report_label }}</h2>
        <form hx-post="{{ url_for('printer_config.save') }}"
            hx-target="#printer-card-{{ card.report_key }}" hx-swap="outerHTML">
            <input type="hidden" name="report_key" value="{{ card.report_key }}">
            <label for="printer-{{ card.report_key }}" class="form-label fw-semibold mb-1">Impresora</label>
            <div class="d-flex flex-column flex-sm-row gap-2">
                <select id="printer-{{ card.report_key }}" name="printer_name" class="form-select" required>
                    <option value="" disabled {% if not card.selected_printer %}selected{% endif %}>
                        Selecciona una impresora
                    </option>
                    {% for printer in printers %}
                    <option value="{{ printer.name }}"
                        {% if printer.name == card.selected_printer %}selected{% endif %}>
                        {{ printer.name }}{% if printer.is_default %} (predeterminada){% endif %}
                    </option>
                    {% endfor %}
                </select>
                <button type="submit" class="btn btn-primary flex-shrink-0">Guardar</button>
            </div>
        </form>
        {% if saved %}
        <div class="alert alert-success py-2 mt-3 mb-0 small" role="alert">
            Impresora guardada para este dispositivo.
        </div>
        {% elif error %}
        <div class="alert alert-danger py-2 mt-3 mb-0 small" role="alert">
            {{ error }}
        </div>
        {% elif card.selected_printer %}
        <p class="text-body-secondary small mt-3 mb-0">
            Impresora actual: <strong>{{ card.selected_printer }}</strong>
        </p>
        {% else %}
        <p class="text-body-secondary small mt-3 mb-0">
            Sin configurar: se usara la impresora predeterminada del servidor.
        </p>
        {% endif %}
    </div>
</div>
