<h1>Contador de Productos</h1>

<div id="main-content">

    {% if not store %}
    <div class="bg-white shadow-sm p-6 rounded-lg space-y-4">
        <h2 class="text-lg font-semibold text-heading">Seleccionar Depósito</h2>
        <form hx-post="{{ url_for('inventory.product_counter') }}" hx-target="#main-content" hx-select="#main-content"
            hx-push-url="true" class="space-y-4">
            <div>
                <label for="store_code" class="block text-sm font-medium text-gray-700 mb-1">Depósito</label>
                <select id="store_code" name="store_code"
                    class="block w-full py-2.5 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="">-- Seleccionar depósito --</option>
                    {% for s in stores %}
                    <option value="{{ s.code }}" {% if s.code==store_code %}selected{% endif %}>{{ s.description }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex justify-end gap-3">
                <button type="submit"
                    class="inline-flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-base text-sm px-4 py-2.5 shadow-xs transition-colors">
                    Aplicar
                </button>
                <button type="button" hx-get="{{ url_for('inventory.index') }}" hx-target="#main-content"
                    hx-select="#main-content" hx-push-url="true"
                    class="inline-flex items-center text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 font-medium rounded-base text-sm px-4 py-2.5 shadow-sm transition-colors">
                    <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                    </svg>
                    Regresar
                </button>
            </div>
        </form>
    </div>

    {% endif %}
    {% if store %}
    {{ store.description}}



    <div>
        <form hx-get="{{ url_for('inventory.search_product_counter', store_code=store.code) }}" hx-target="body"
            hx-swap="beforeend" autocomplete="off">
            <input type="hidden" name="store_code" value="{{ store.code }}">
            <label for="">Codigo de producto</label>
            <input type="text" name="product_code">
        </form>
    </div>

    <!-- resultado del conteo de productos -->
    <div>
        <form hx-post="{{ url_for('inventory.save_products_counter', store_code=store.code) }}">

            <div id="controls">
                <button type="button" hx-post="{{ url_for('inventory.clear_product_counter') }}"
                    hx-target="#counter-results" hx-swap="innerHTML"
                    class="text-red-600 hover:text-red-800 text-xs font-medium">
                    Limpiar
                </button>
                <button
                    type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
                    Finalizar Conteo
                </button>

            </div>
            <table class="w-full text-sm text-left text-gray-500">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                    <tr scope="col" class="px-6 py-3">
                        <th scope="col" class="px-6 py-3">Código</th>
                        <th scope="col" class="px-6 py-3">Descripción</th>
                        <th scope="col" class="px-6 py-3">Referencia</th>
                        <th scope="col" class="px-6 py-3">Unidad</th>
                        <th scope="col" class="px-6 py-3">Existencia</th>
                        <th scope="col" class="px-6 py-3">Cantidad contada</th>
                        <th scope="col" class="px-6 py-3">Diferencia</th>
                    </tr>
                </thead>
                <tbody id="counter-results">
                    {{ counter_rows_html|safe if counter_rows_html else '' }}
                </tbody>
            </table>
        </form>
    </div>





    {% endif %}


</div>
