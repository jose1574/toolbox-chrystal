
{% extends "base.html" %}
{% block content %}
<div class="px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Chequeo de Orden de Recolección</h1>
    {% if error %}
    <div class="mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" role="alert">
        <span class="font-medium">Error:</span> {{ error|safe }}
    </div>
    {% endif %}
    <form 
        hx-post="{{ url_for('inventory.check_order') }}"
        hx-target="#main-content"
        hx-select="#main-content"
        hx-swap="innerHTML"
        id="check-order-form"
    >
        <div class="space-y-3">
            <label for="order_id" class="block text-sm font-medium text-gray-700">Correlativo de la orden</label>
            <input type="number" id="order_id" name="order_id" value="{{ error and '' or '9250' }}"
                   class="block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            <button type="submit" class="inline-flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                Cargar Orden
            </button>
        </div>
    </form>
</div>
{% endblock %}
