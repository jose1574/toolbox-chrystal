<div id="product-modal" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-flex align-items-center justify-content-center p-3" style="z-index: 1055;" hx-target="this" hx-swap="outerHTML" role="dialog" aria-modal="true">
    <div class="p-3 border w-100 shadow rounded bg-white" style="max-width: 32rem;">
        <div class="d-flex align-items-start justify-content-between mb-2">
            <h2 class="h5 fw-semibold text-dark mb-0">Parametros del producto</h2>
            <button type="button" class="btn btn-link btn-sm text-decoration-none p-0" data-close-product-modal>Cerrar</button>
        </div>

        <div class="d-grid gap-1 small text-secondary">
            <p><strong>Codigo:</strong> {{ product.code if product else '-' }}</p>
            <p><strong>Descripcion:</strong> {{ product.description if product else '-' }}</p>
            <p><strong>Deposito:</strong> {{ store.description if store else '-' }}</p>
            <p><strong>Unidad:</strong> {{ unit.description if unit else '-' }}</p>

            <form id="product-params-form" action="{{ url_for('inventory.modal_product_params') }}" method="post">

                <input type="text" name="product_code" value="{{ product.code if product else '' }}" hidden>
                <input type="text" name="store_code" value="{{ store.code if store else '' }}" hidden>
                <div>
                    <label for="minimal_stock" class="form-label small fw-semibold text-secondary">Stock Minimo</label>
                    <input type="number" id="minimal_stock" name="minimal_stock" value="{{ product_params.minimal_stock if product_params else 0 }}" class="form-control form-control-sm">
                </div>
                <div>
                    <label for="maximum_stock" class="form-label small fw-semibold text-secondary">Stock Maximo</label>
                    <input type="number" id="maximum_stock" name="maximum_stock" value="{{ product_params.maximum_stock if product_params else 0 }}" class="form-control form-control-sm">
                </div>
                <div class="mt-2">
                    <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
