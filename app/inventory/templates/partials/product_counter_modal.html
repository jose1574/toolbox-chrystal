<!-- Modal para detalles del producto -->
<div id="productModal" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-flex align-items-center justify-content-center" style="z-index: 1055;">
    <div class="p-3 border w-100 shadow rounded bg-body" style="max-width: 32rem;">
        <div class="d-flex align-items-start justify-content-between">
            <h3 class="h5 fw-semibold text-body mb-0">Detalles del Producto</h3>
            <button type="button" onclick="document.getElementById('productModal').remove()"
                class="btn btn-link btn-sm text-decoration-none p-0" aria-label="Cerrar">
                <svg width="16" height="16" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                </svg>
            </button>
        </div>
        <div class="mt-2 px-1 d-grid gap-1 small text-body-secondary">
            <p><span class="fw-semibold">Código:</span> {{ product.code }}</p>
            <p><span class="fw-semibold">Descripción:</span> {{ product.description }}</p>
            <p><span class="fw-semibold">Referencia:</span> {{ product.referenc }}</p>
            <p><span class="fw-semibold">Cantidad Esperada:</span> {{ stock.stock }}</p>
            <p><span class="fw-semibold">Unidad:</span> {{ unit.description }}</p>
        </div>
        <form
            hx-post="{{ url_for('inventory.update_product_counter') }}"
            hx-target="#counter-results"
            hx-swap="innerHTML"
            hx-on:htmx:after-request="if(event.detail.successful){document.getElementById('productModal')?.remove();var input=document.getElementById('product_code');if(input){input.value='';input.focus();if(input.select){input.select();}}}"
        >
            <input type="text" name="product_code" value="{{ product.code }}" hidden>
            <input type="text" name="store_code" value="{{ store.code }}" hidden>
            <!-- snapshot de existencia al momento del conteo -->
            <input type="hidden" name="system_qty" value="{{ stock.stock if stock else 0 }}">
            <label for="counted_amount" class="form-label small fw-semibold text-body-secondary">Cantidad Contada</label>
            <input type="number" id="counted_amount" name="counted_amount" step="0.01"
                class="form-control form-control-sm mt-1">
            <div class="mt-3 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-sm">
                    Guardar
                </button>
        </form>
    </div>
</div>

<script>
    // Enfocar el input de cantidad contada al abrir el modal
    setTimeout(function () {
        const amountInput = document.getElementById('counted_amount');
        if (amountInput) {
            amountInput.focus();
            amountInput.select();
        }
    }, 100);
</script>
