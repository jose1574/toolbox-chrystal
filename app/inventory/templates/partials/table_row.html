{% set has_diff = counted_amount != detail.amount %}
<tr id="row-{{ detail.code_product }}"{% if has_diff %} class="row-diff"{% endif %}>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm font-medium text-gray-900 wrap-break-word{% if has_diff %} text-red-900 dark:text-red-200{% endif %}">{{ detail.code_product }}</td>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm text-gray-500 wrap-break-word{% if has_diff %} text-red-900 dark:text-red-200{% endif %}">{{ detail.description_product }}</td>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm text-gray-500 hidden md:table-cell wrap-break-word{% if has_diff %} text-red-900 dark:text-red-200{% endif %}">{{ detail.referenc }}</td>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm text-center text-gray-500{% if has_diff %} text-red-900 dark:text-red-200{% endif %}">{{ detail.amount }}</td>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm text-center text-gray-500{% if has_diff %} text-red-900 dark:text-red-200{% endif %}" id="counted-{{ detail.code_product }}">
        {{ counted_amount }}
    </td>
    <td class="px-2 py-2 sm:px-3 md:px-4 md:py-3 text-[11px] sm:text-xs md:text-sm text-center text-gray-500{% if has_diff %} text-red-900 dark:text-red-200{% endif %}" id="diff-{{ detail.code_product }}">
        {{ (counted_amount - detail.amount) }}
        {% if has_diff %}
        <span class="ml-1 inline-flex items-center rounded-full bg-red-100 px-1.5 py-0.5 text-[10px] sm:text-xs font-medium text-red-800 dark:text-red-200">Dif.</span>
        {% endif %}
    </td>
</tr>
