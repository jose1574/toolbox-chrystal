<tr id="row-{{ item.code_product }}" data-code="{{ item.code_product }}" data-expected="{{ item.amount }}">
    <td class="px-4 py-3 fw-semibold text-body">{{ item.code_product }}</td>
    <td class="px-4 py-3 small fw-semibold leading-relaxed">
        {{ product_description }}
    </td>
    <td class="px-4 py-3 text-center text-body-secondary">
        {{ unit_description }}
    </td>
    <td class="px-4 py-3 text-center fw-bold text-primary bg-primary-subtle" id="order-amount-{{ item.code_product }}">
        {{ item.amount }}
    </td>
    <td class="px-4 py-3 text-center" id="counted-{{ item.code_product }}">
        --
    </td>
    <td class="px-4 py-3 text-center" id="status-{{ item.code_product }}">
        <span
            class="d-inline-flex align-items-center px-2 py-0 rounded-pill small fw-semibold bg-body-tertiary text-body border border-secondary-subtle">
            Pendiente
        </span>
    </td>
    <td class="px-4 py-3 text-center">
        <button type="button" 
            hx-post="{{ url_for('inventory.delete_product_from_order') }}" 
            hx-target="[id='row-{{ item.code_product }}']"
            hx-swap="delete"
            hx-include="[name='order_id'],[name='code_product']"
            hx-confirm="¿Estás seguro de que quieres eliminar este producto de la orden?"
            hx-on:htmx:afterRequest="const hidden=document.getElementById('hidden-counted-{{ item.code_product }}'); if(hidden){hidden.remove();}"
            class="btn btn-outline-danger btn-sm"
            >
            Quitar
        </button>
        <input type="hidden" name="order_id" value="{{ order.correlative }}">
        <input type="hidden" name="code_product" value="{{ item.code_product }}">
    </td>
</tr>
