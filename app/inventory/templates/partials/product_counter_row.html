<tr class="border-b border-gray-200 last:border-b-0">
    <!-- datos ocultos para que HTMX pueda enviarlos al borrar -->
    <input type="hidden" name="product_code" value="{{ product.code }}">
    <input type="hidden" name="store_code" value="{{ store_code }}">

    <td class="py-2">{{ product.code }}</td>
    <td class="py-2">{{ product.description }}</td>
    <td class="py-2">{{ product.referenc }}</td>
    <td class="py-2">{{ unit.description }}</td>
    <td class="py-2">{{ system_qty }}</td>
    <td class="py-2">{{ counted_amount }}</td>
    <td class="py-2">{{ difference }}</td>
    <td class="py-2">
        <button
            type="button"
            hx-post="{{ url_for('inventory.remove_product_counter_row') }}"
            hx-target="closest tr"
            hx-include="closest tr"
            hx-swap="outerHTML"
            class="text-red-600 hover:text-red-800 text-xs font-medium"
        >
            Quitar
        </button>
    </td>
</tr>
