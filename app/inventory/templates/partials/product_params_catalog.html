<form
  class="mb-3"
  hx-get="{{ url_for('inventory.product_params_catalog') }}"
  hx-target="#product-params-catalog-results"
  hx-swap="outerHTML"
  hx-trigger="input from:#product-params-catalog-query changed delay:300ms, submit"
>
  <input type="hidden" name="store_code" value="{{ store_code }}" />
  <input type="hidden" name="page" value="1" />
  <label
    for="product-params-catalog-query"
    class="form-label small fw-semibold text-body-secondary"
    >Filtrar productos</label
  >
  <input
    id="product-params-catalog-query"
    type="text"
    name="q"
    value="{{ query or '' }}"
    class="form-control form-control-sm"
    placeholder="Código, descripción, referencia, marca o modelo..."
    autocomplete="off"
  />
</form>

{% include "partials/product_params_catalog_results.html" %}
