
<div id="msg-error">
    {% if error %}
    <div class="mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" role="alert">
        <span class="font-medium">Error:</span> {{ error|safe }}
    </div>
    {% endif %}
</div>
<form hx-post="{{ url_for('inventory.select_stores') }}" hx-target="#main-content" hx-swap="innerHTML"
    id="store-selection-form" class="space-y-4">
    <div id="form-select-store" class="bg-white shadow-md rounded-lg p-4 mb-4 border border-gray-200">
        <h2 class="text-base font-semibold text-gray-800 mb-3">Seleccionar Depósitos</h2>
        <div>
            <label for="store_origin" class="block text-sm font-medium text-gray-700">Depósito origen</label>
            <select id="store_origin" name="store_origin"
                class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                <option value="">-- Seleccionar depósito origen --</option>
                {% for store in stores %}
                <option value="{{ store.code }}">
                    {{ store.description }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="store_dst" class="block text-sm font-medium text-gray-700">Depósito destino</label>
            <select id="store_dst" name="store_dst"
                class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                <option value="">-- Seleccionar depósito destino --</option>
                {% for s in stores %}
                <option value="{{ s.code }}">
                    {{ s.description}}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="flex items-center">
            <button type="submit" id="apply-store-selection"
                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2.5 transition-colors">Aplicar</button>
        </div>
    </div>

</form>
