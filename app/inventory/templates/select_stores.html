
<div class="py-8 px-4">
    <div class="mx-auto w-full max-w-md">
        {% if new_order_id %}
        <div class="mb-4 p-4 text-sm text-green-800 rounded-lg bg-green-50 border border-green-200" role="status">
            Orden de recolección <strong>#{{ new_order_id }}</strong> creada exitosamente.
            Si el PDF no se abrió automáticamente,
            <a href="{{ url_for('inventory.order_collection_report', order_id=new_order_id) }}" target="_blank" class="font-semibold underline">haz clic aquí para verlo</a>.
        </div>
        <script>
            (function(){
                var url = "{{ url_for('inventory.order_collection_report', order_id=new_order_id) }}";
                setTimeout(function(){ window.open(url, '_blank'); }, 150);
            })();
        </script>
        {% endif %}

        <div id="msg-error">
            {% if error %}
            <div class="mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" role="alert">
                <span class="font-medium">Error:</span> {{ error|safe }}
            </div>
            {% endif %}
        </div>

        <form hx-post="{{ url_for('inventory.select_stores') }}" hx-target="#main-content" hx-swap="innerHTML"
              id="store-selection-form" class="space-y-6">
          <div id="form-select-store" class="bg-white shadow-lg rounded-xl p-6 border border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 text-center">Seleccionar Depósitos</h2>

                <div class="mb-5">
                    <label for="store_origin" class="block text-sm font-medium text-gray-700 mb-1">Depósito origen</label>
                    <select id="store_origin" name="store_origin"
                                    class="block w-full py-2.5 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 text-sm">
                        <option value="">-- Seleccionar depósito origen --</option>
                        {% for store in stores %}
                        <option value="{{ store.code }}">{{ store.description }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-6">
                    <label for="store_dst" class="block text-sm font-medium text-gray-700 mb-1">Depósito destino</label>
                    <select id="store_dst" name="store_dst"
                                    class="block w-full py-2.5 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 text-sm">
                        <option value="">-- Seleccionar depósito destino --</option>
                        {% for s in stores %}
                        <option value="{{ s.code }}">{{ s.description}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="flex justify-center">
                    <button type="submit" id="apply-store-selection"
                                    class="inline-flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                        Aplicar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
